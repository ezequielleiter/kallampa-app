<!-- @dsCard group="Panel" viewport="1280x800" subtitle="Panel de producción: lotes y detalle de lote" name="Panel Kallampa" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kallampa · Panel</title>
<link rel="stylesheet" href="../../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}a{color:var(--color-accent-300);text-decoration:none}a:hover{color:var(--color-accent-100)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../dev/load-components.js"></script>
</head><body><div id="root"></div>
<script type="text/babel" src="LotesScreen.jsx"></script>
<script type="text/babel" src="LoteScreen.jsx"></script>
<script type="text/babel">
window.kallampaReady.then(() => {
  const { Sidebar, Topbar, Toast } = window.KallampaDS;
  const LOTS = [
    { code: 'ENK-L-2026-001', species: 'Enoki', latin: 'Flammulina velutipes', origin: 'Cepa M-03 (G2)', start: '07/09/2026', stage: 'Cosecha', state: 'En curso' },
    { code: 'OST-L-2026-004', species: 'Ostra rosada', latin: 'Pleurotus djamor', origin: 'ML-2026-005', ml: true, start: '15/09/2026', stage: 'Incubación', state: 'En curso' },
    { code: 'MDL-L-2026-003', species: 'Melena de león', latin: 'Hericium erinaceus', origin: 'Cepa HE-02 (G2)', start: '20/09/2026', stage: 'Inoculación', state: 'En curso' },
    { code: 'SHI-L-2026-002', species: 'Shiitake', latin: 'Lentinula edodes', origin: 'ML-2026-002', ml: true, start: '02/07/2026', stage: '—', state: 'Finalizado' },
  ];
  function App() {
    const [view, setView] = React.useState('lotes');
    const [toast, setToast] = React.useState(null);
    const crumbs = view === 'lotes' ? [{ label: 'Producción' }, { label: 'Lotes' }] : [{ label: 'Producción' }, { label: 'Lotes', onClick: () => setView('lotes') }, { label: 'ENK-L-2026-001' }];
    return (
      <div style={{ display: 'grid', gridTemplateColumns: 'var(--sidebar-width) minmax(0,1fr)', minHeight: '100vh' }}>
        <Sidebar user="ezequielleiter" items={[['Producción', 'plant'], ['Micelio', 'flask'], ['Invernaderos', 'thermometer-simple'], ['Calendario', 'calendar-blank'], ['Trazabilidad', 'tree-structure'], ['Notas', 'note'], ['Identificador', 'barcode'], ['Inventario', 'package'], ['Estadísticas', 'chart-bar']].map(([label, icon], i) => ({ label, icon, active: i === 0, onClick: () => i === 0 && setView('lotes') }))}
          footer={<><a href="#" style={{ display: 'flex', gap: 10, padding: '7px 10px', fontSize: 13, color: 'var(--text-muted)' }}><i className="ph ph-gear" style={{ fontSize: 16 }} />Configuraciones</a><a href="#" style={{ display: 'flex', gap: 10, padding: '7px 10px', fontSize: 13, color: 'var(--text-muted)' }}><i className="ph ph-sign-out" style={{ fontSize: 16 }} />Cerrar sesión</a></>} />
        <main style={{ minWidth: 0 }}>
          <Topbar crumbs={crumbs} />
          {view === 'lotes' ? <LotesScreen lots={LOTS} onOpen={l => l.code === 'ENK-L-2026-001' ? setView('lote') : setToast('En este kit solo ENK-L-2026-001 tiene detalle')} onNew={() => setToast('El formulario de Nuevo lote está en el prototipo completo')} />
            : <LoteScreen notify={setToast} />}
        </main>
        <Toast message={toast} onDone={() => setToast(null)} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
});
</script></body></html>
