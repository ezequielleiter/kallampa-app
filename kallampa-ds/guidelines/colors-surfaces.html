<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Kallampa · Superficies y texto</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}a{color:var(--color-accent-300);text-decoration:none}a:hover{color:var(--color-accent-100)}</style>
</head><body style="padding:20px;font-size:12px">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--surface-page);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Página</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--surface-page</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Card</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--surface-card</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--surface-inset);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Hundida</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--surface-inset</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--surface-selected);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Seleccionado</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--surface-selected</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--color-section);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Banda (landing)</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--color-section</div></div></div>
<div style="display:flex;gap:18px;margin-top:14px;font-size:14px"><span style="color:var(--text-strong)">text-strong</span><span style="color:var(--text-body)">text-body</span><span style="color:var(--text-muted)">text-muted</span><span style="color:var(--text-subtle)">text-subtle</span><span style="color:var(--text-accent)">text-accent</span></div>
</body></html>
