<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Kallampa · Estados</title>
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}a{color:var(--color-accent-300);text-decoration:none}a:hover{color:var(--color-accent-100)}</style>
</head><body style="padding:20px;font-size:12px">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--status-active);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Activo · listo</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--status-active</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--status-done);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Usado · finalizado</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--status-done</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--color-danger);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Contaminado</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--color-danger</div></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:44px;border-radius:8px;background:var(--color-danger-bg);box-shadow:inset 0 0 0 1px var(--color-divider)"></div><div style="font-size:11px">Fondo de error</div><div style="font-size:10.5px;color:var(--text-subtle);font-family:ui-monospace,Menlo,monospace">--color-danger-bg</div></div></div>
<div style="display:flex;gap:8px;margin-top:14px;align-items:center"><span class="tag tag-outline">Colonizando</span><span class="tag tag-accent">Colonizado</span><span class="tag tag-neutral">Usado</span><span class="tag" style="background:var(--color-danger-bg);color:var(--color-danger-text)">Contaminado</span><span style="font-size:12px;color:var(--color-danger-text);display:flex;gap:5px;align-items:center"><i class="ph ph-warning-circle"></i>Ingresá el peso de grano.</span></div>
</body></html>
