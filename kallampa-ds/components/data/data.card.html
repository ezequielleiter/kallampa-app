<!-- @dsCard group="Components" viewport="700x380" subtitle="Etapas, cifras, tablas, días y costos" name="Data" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Kallampa · Data</title>
<link rel="stylesheet" href="../../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}a{color:var(--color-accent-300);text-decoration:none}a:hover{color:var(--color-accent-100)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../dev/load-components.js"></script>
</head><body style="padding:20px"><div id="root"></div>
<script type="text/babel">
window.kallampaReady.then(NS => {

const { Stepper, KpiGrid, Table, ProgressDays, StatusTag, CostBreakdown } = NS;
function Demo() { return (<div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
  <Stepper steps={[{ name: 'Inoculación', meta: '07/09 · 5 frascos', state: 'done' }, { name: 'Incubación', meta: '1 incubando', state: 'active' }, { name: 'Fructificación', meta: '1 fructificando', state: 'active' }, { name: 'Cosecha', meta: '4,00 kg', state: 'pending' }]} />
  <KpiGrid items={[{ label: 'Peso cosechado', value: '4,00 kg', note: '2 oleadas' }, { label: 'Eficiencia biológica', value: '80,0 %', note: 'sobre 5,00 kg' }, { label: 'Costo por kg', value: '$ 2.290' }]} />
  <div style={{ display: 'grid', gridTemplateColumns: '1fr 220px', gap: 20 }}>
    <Table minWidth={380} rows={[{ c: 'R02', s: 'Fructificando', d: 3, t: 14 }, { c: 'R03', s: 'Incubando', d: 4, t: 14 }]} columns={[{ key: 'c', label: 'N° de seguimiento', numeric: true }, { key: 's', label: 'Estado', render: r => <StatusTag status={r.s} /> }, { key: 'd', label: 'Días', render: r => <ProgressDays value={r.d} total={r.t} status={r.s} /> }]} />
    <CostBreakdown items={[{ name: 'Grano (arroz)', value: 6000 }, { name: 'Sustrato', value: 2560 }, { name: 'Energía', value: 400 }, { name: 'Bolsas', value: 200 }]} />
  </div>
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
