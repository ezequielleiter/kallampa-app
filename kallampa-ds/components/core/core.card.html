<!-- @dsCard group="Components" viewport="700x300" subtitle="Botones, etiquetas de estado, puntos y logo" name="Core" -->
<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Kallampa · Core</title>
<link rel="stylesheet" href="../../../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}a{color:var(--color-accent-300);text-decoration:none}a:hover{color:var(--color-accent-100)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="../../dev/load-components.js"></script>
</head><body style="padding:20px"><div id="root"></div>
<script type="text/babel">
window.kallampaReady.then(NS => {

const { Button, IconButton, Tag, StatusTag, StatusDot, Logo } = NS;
const row = { display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' };
function Demo() { return (<div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
  <div style={row}><Button icon="plus">Nueva incubación</Button><Button variant="secondary">Cancelar</Button><Button variant="ghost" icon="git-branch">Clonar</Button><Button loading>Ingresando…</Button><Button disabled>Deshabilitado</Button></div>
  <div style={row}><IconButton icon="dots-three" label="Acciones" /><IconButton icon="pencil-simple" label="Editar" /><IconButton icon="barcode" label="Escanear" variant="secondary" size={36} /></div>
  <div style={row}>{['Colonizando','Colonizado','Incubando','Fructificando','Listo','Usado','Finalizado','Descartado','Contaminado'].map(s => <StatusTag key={s} status={s} />)}</div>
  <div style={row}><Tag tone="accent">2 colonizados</Tag><Tag tone="outline">1 colonizando</Tag><Tag tone="danger">1 contaminado</Tag>{['Colonizado','Colonizando','Usado','Contaminado'].map(s => <span key={s} style={{ display: 'inline-flex', gap: 6, alignItems: 'center', fontSize: 12 }}><StatusDot status={s} />{s}</span>)}</div>
  <div style={row}><Logo /><Logo size={40} /><Logo size={40} wordmark={false} /></div>
</div>); }
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
});
</script></body></html>
